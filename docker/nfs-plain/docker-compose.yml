services:
  nfs-tester:
    build: .
    container_name: test_nfs
    read_only: true
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    tmpfs:
      - /tmp:noexec,nosuid,size=5g
    volumes:
      - nfs_puro:/app/nfs_test
      - ./benchmark.sh:/app/benchmark.sh:ro
    restart: unless-stopped

volumes:
  nfs_puro:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NFS_SERVER},rw,nfsvers=4,wsize=1048576,rsize=1048576"
      device: ":${NFS_PLAIN_EXPORT:-/srv/nfs/exports/data}"