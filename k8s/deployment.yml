apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-cifrado
  labels:
    app: cifrado
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cifrado
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: cifrado
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ubuntu-cifrado-nfs:latest
          imagePullPolicy: Never
          stdin: true
          tty: true
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            appArmorProfile:
              type: Unconfined
            capabilities:
              drop: ["ALL"]
              add: ["SYS_ADMIN"]
          resources:
            limits:
              smarter-devices/fuse: 1
            requests:
              smarter-devices/fuse: 1
          volumeMounts:
            - name: nfs-cifrado
              mountPath: /app/cifrado
              readOnly: false
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nfs-cifrado
          nfs:
            server: "${NFS_SERVER}"
            path: "${NFS_EXPORT}"
            readOnly: false
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 5Gi